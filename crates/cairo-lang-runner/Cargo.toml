[package]
name = "cairo-lang-runner"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Basic cairo runner."

[dependencies]
cairo-lang-casm = { path = "../cairo-lang-casm", version = "=2.20.0" }
cairo-lang-lowering = { path = "../cairo-lang-lowering", version = "=2.20.0" }
cairo-lang-runnable-utils = { path = "../cairo-lang-runnable-utils", version = "=2.20.0" }
cairo-lang-sierra = { path = "../cairo-lang-sierra", version = "=2.20.0" }
cairo-lang-sierra-generator = { path = "../cairo-lang-sierra-generator", version = "=2.20.0" }
cairo-lang-sierra-to-casm = { path = "../cairo-lang-sierra-to-casm", version = "=2.20.0" }
cairo-lang-starknet = { path = "../cairo-lang-starknet", version = "=2.20.0" }
cairo-lang-utils = { path = "../cairo-lang-utils", version = "=2.20.0", features = ["tracing"] }
cairo-vm.workspace = true
clap.workspace = true
itertools = { workspace = true, default-features = true }
keccak.workspace = true
lambdaworks-math.workspace = true
num-bigint = { workspace = true, default-features = true }
num-integer.workspace = true
num-traits = { workspace = true, default-features = true }
rand.workspace = true
salsa.workspace = true
serde.workspace = true
sha2.workspace = true
starknet-types-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
cairo-lang-compiler = { path = "../cairo-lang-compiler" }
cairo-lang-defs = { path = "../cairo-lang-defs" }
cairo-lang-semantic = { path = "../cairo-lang-semantic", features = ["testing"] }
cairo-lang-test-utils = { path = "../cairo-lang-test-utils", features = ["testing"] }
indoc.workspace = true
test-case.workspace = true
tracing.workspace = true
